name: norwegian-law
version: "1.2.0"
description: Norwegian law knowledge graph — laws, regulations, ministries, legal areas, EU directives, and EuroVoc concepts
author: Emergent Company
license: MIT
repositoryUrl: https://github.com/emergent-company/norwegian-law-memory-blueprint

objectTypes:
  - name: Law
    label: Law
    description: "A Norwegian act of parliament (lov) currently in force"
    properties:
      name:
        type: string
        description: Display name (short title or full title)
      title:
        type: string
        description: Full official title
      ref_id:
        type: string
        description: Lovdata reference ID (e.g. lov/2005-06-17-90)
      doc_id:
        type: string
        description: Lovdata document ID
      short_title:
        type: string
        description: Abbreviated popular title (e.g. arbeidsmiljøloven)
      legacy_id:
        type: string
        description: Legacy Lovdata identifier
      language:
        type: string
        description: Document language code (nb, nn, etc.)
      date_in_force:
        type: date
        description: Date the law entered into force (YYYY-MM-DD)
      date_in_force_raw:
        type: string
        description: Raw Lovdata "in force" text when it is not an ISO date (e.g. "Inntektsåret 1989")
      year_in_force:
        type: number
        description: Year the law entered into force
      decade_in_force:
        type: string
        description: "Decade the law entered into force, e.g. 2000s"
      last_change_in_force:
        type: date
        description: Date of last amendment in force (YYYY-MM-DD)
      date_of_publication:
        type: date
        description: Date of official publication; clock time from the source is dropped
      date_of_publication_raw:
        type: string
        description: Raw Lovdata publication text when it is not a parseable date
      applies_to:
        type: string
        description: Territorial scope (e.g. hele landet)
      eea_references:
        type: string
        description: Raw EEA/EØS references text from metadata
      content:
        type: string
        description: Full body text rendered as Markdown
      content_unavailable:
        type: boolean
        description: True when Lovdata served an error placeholder and the body is unavailable

  - name: Regulation
    label: Regulation
    description: "A Norwegian regulation (forskrift) currently in force"
    properties:
      name:
        type: string
        description: Display name (short title or full title)
      title:
        type: string
        description: Full official title
      ref_id:
        type: string
        description: Lovdata reference ID (e.g. forskrift/2009-12-18-1585)
      doc_id:
        type: string
        description: Lovdata document ID
      short_title:
        type: string
        description: Abbreviated popular title
      legacy_id:
        type: string
        description: Legacy Lovdata identifier
      language:
        type: string
        description: Document language code (nb, nn, etc.)
      date_in_force:
        type: date
        description: Date the regulation entered into force (YYYY-MM-DD)
      date_in_force_raw:
        type: string
        description: Raw Lovdata "in force" text when it is not an ISO date (e.g. "Inntektsåret 1989")
      year_in_force:
        type: number
        description: Year the regulation entered into force
      decade_in_force:
        type: string
        description: "Decade the regulation entered into force, e.g. 2000s"
      last_change_in_force:
        type: date
        description: Date of last amendment in force (YYYY-MM-DD)
      date_of_publication:
        type: date
        description: Date of official publication; clock time from the source is dropped
      date_of_publication_raw:
        type: string
        description: Raw Lovdata publication text when it is not a parseable date
      applies_to:
        type: string
        description: Territorial scope
      eea_references:
        type: string
        description: Raw EEA/EØS references text from metadata
      content:
        type: string
        description: Full body text rendered as Markdown
      content_unavailable:
        type: boolean
        description: True when Lovdata served an error placeholder and the body is unavailable

  - name: Ministry
    label: Ministry
    description: "A Norwegian government ministry that administers laws or regulations"
    properties:
      name:
        type: string
        description: Official ministry name

  - name: LegalArea
    label: Legal Area
    description: "A legal subject-matter area or sub-area in the Lovdata classification"
    properties:
      name:
        type: string
        description: Legal area name
      parent_area:
        type: string
        description: Name of the parent legal area (for sub-areas only)

  - name: LegalParagraph
    label: Legal Paragraph
    description: "A single § (article/paragraph) extracted from a law or regulation"
    properties:
      name:
        type: string
        description: Display name (statutory paragraph number + optional title, e.g. "§ 8-10 Finansiell bistand"); falls back to a human-readable structural position when the source has no § header
      content:
        type: string
        description: Full Markdown text of this paragraph
      section_id:
        type: string
        description: HTML section ID (e.g. kapittel-1-paragraf-3). Structural key only — its kapittel/paragraf numbers are HTML indices, not statutory § numbers.
      paragraph_num:
        type: string
        description: Statutory paragraph number as printed (e.g. § 1-3, § 121 d); empty only when the source carries no § header
      section_label:
        type: string
        description: Human-readable section label — the statutory § number (e.g. "§ 8-10") when the source has one, otherwise a structural position (e.g. "Kapittel 1, ledd 1"); never the raw section_id key
      law_ref_id:
        type: string
        description: Lovdata reference ID of the parent law or regulation
      position:
        type: number
        description: Ordinal position of this paragraph within the document
      chapter_id:
        type: string
        description: Chapter section ID (e.g. kapittel-1; empty for unchaptered laws)
      title:
        type: string
        description: Optional heading for this paragraph

  - name: PreparatoryWork
    label: Preparatory Work
    description: "A forarbeid (NOU, Ot.prp., Prop., Innst., Lovvedtak, …) referenced by a law or regulation"
    properties:
      name:
        type: string
        description: Display name (anchor text, e.g. Prop. 71 LS (2025–2026))
      ref_id:
        type: string
        description: Canonical forarbeid slug (e.g. prop-71-ls-202526)
      prep_type:
        type: string
        description: "Classification (proposisjon, innstilling, lovvedtak, nou, melding, dok, representantforslag, lovanm, unknown)"
      session:
        type: string
        description: Parliamentary session (e.g. 2025-2026)
      document_number:
        type: string
        description: Document number within the session (e.g. 71)
      year:
        type: string
        description: Session start year (or the NOU year)
      source:
        type: string
        description: Provenance of the reference (lovdata-ref or stortinget)
      source_url:
        type: string
        description: URL to the forarbeid source (Lovdata or Stortinget/PDF)
      title:
        type: string
        description: Stortinget publication title (when full text matched)
      content:
        type: string
        description: Full Markdown text (when available)
      source_hash:
        type: string
        description: SHA-256 of the raw source XML (change detection)
      content_available:
        type: boolean
        description: Whether full text is available (false in metadata-only phase)

  - name: EUDirective
    label: EU Directive
    description: "An EU/EEA directive referenced by or implemented in Norwegian law"
    properties:
      name:
        type: string
        description: Short display title
      celex_id:
        type: string
        description: EUR-Lex CELEX identifier (e.g. 32014L0026)
      full_title:
        type: string
        description: Full official title from EUR-Lex
      form:
        type: string
        description: Legal form (Directive, Regulation, Decision, etc.)
      date_of_document:
        type: date
        description: Date of adoption
      date_of_effect:
        type: date
        description: Date of entry into force
      author:
        type: string
        description: Authoring institution (e.g. European Parliament and of the Council)
      responsible_dg:
        type: string
        description: Directorate-General responsible for the act (from CELLAR)
      subject_matter:
        type: string
        description: EUR-Lex subject-matter classification
      directory_code:
        type: string
        description: EUR-Lex directory-code classification label
      legal_basis:
        type: string
        description: Treaty/legal-basis CELEX identifiers (semicolon-joined)
      procedure_num:
        type: string
        description: Interinstitutional procedure reference (e.g. 2000/0169/COD)
      oj_reference:
        type: string
        description: Official Journal reference (e.g. OJ L 84, 20.3.2014)
      content:
        type: string
        description: Full legislative text rendered as Markdown

  - name: EuroVocConcept
    label: EuroVoc Concept
    description: "A controlled vocabulary concept from the EU EuroVoc thesaurus"
    properties:
      name:
        type: string
        description: English preferred label
      eurovoc_id:
        type: string
        description: EuroVoc numeric concept ID
      label_en:
        type: string
        description: English preferred label (duplicate of name for clarity)

relationshipTypes:
  - name: PREPARES
    label: Prepares
    description: A PreparatoryWork (forarbeid) underpins a Law or Regulation
    sourceType: PreparatoryWork
    targetType: Law

  - name: DERIVES_FROM
    label: Derives From
    description: A PreparatoryWork (innstilling/lovvedtak) builds on another PreparatoryWork (proposisjon/NOU)
    sourceType: PreparatoryWork
    targetType: PreparatoryWork

  - name: ADMINISTERED_BY
    label: Administered By
    description: Law or Regulation is administered by a Ministry
    sourceType: Law
    targetType: Ministry

  - name: IN_LEGAL_AREA
    label: In Legal Area
    description: Law or Regulation belongs to a LegalArea subject-matter classification
    sourceType: Law
    targetType: LegalArea

  - name: AMENDED_BY
    label: Amended By
    description: Law or Regulation was last amended by another Law or Regulation
    sourceType: Law
    targetType: Law

  - name: AMENDS
    label: Amends
    description: Law or Regulation amends another Law or Regulation
    sourceType: Law
    targetType: Law

  - name: SEE_ALSO
    label: See Also
    description: Non-hierarchical cross-reference between two laws or regulations
    sourceType: Law
    targetType: Law

  - name: HAS_LANGUAGE_VARIANT
    label: Has Language Variant
    description: Law or Regulation has a parallel version in another language
    sourceType: Law
    targetType: Law

  - name: REFERENCES
    label: References
    description: Body text of a Law or Regulation links to another Law or Regulation
    sourceType: Law
    targetType: Law

  - name: IMPLEMENTS_EEA
    label: Implements EEA
    description: Law or Regulation implements an EU Directive under the EEA Agreement
    sourceType: Law
    targetType: EUDirective

  - name: HAS_PARAGRAPH
    label: Has Paragraph
    description: Law or Regulation contains a LegalParagraph
    sourceType: Law
    targetType: LegalParagraph

  - name: CITES_EU_LAW
    label: Cites EU Law
    description: Body text of a Law or Regulation cites an EU Directive directly
    sourceType: Law
    targetType: EUDirective

  - name: EU_CITES
    label: EU Cites
    description: EU Directive cites another EU Directive
    sourceType: EUDirective
    targetType: EUDirective

  - name: EU_MODIFIED_BY
    label: EU Modified By
    description: EU Directive was modified by another EU Directive
    sourceType: EUDirective
    targetType: EUDirective

  - name: HAS_EUROVOC_DESCRIPTOR
    label: Has EuroVoc Descriptor
    description: EU Directive is classified under a EuroVoc thesaurus concept
    sourceType: EUDirective
    targetType: EuroVocConcept
