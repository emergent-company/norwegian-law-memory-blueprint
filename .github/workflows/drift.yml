name: Golden corpus drift detection

on:
  push:
    branches: [main]
    paths:
      - 'seed/**'
      - 'cmd/seeder/**'
      - 'tests/golden/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify golden anchors
        run: go test ./tests/golden/ -v

      - name: Open or update drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- golden-drift -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n\nThe golden corpus drift contract failed.\n\nSee [the failed run](${runUrl}).\n\nTo re-pin intentionally changed anchors:\n\n\`\`\`\ngo test ./tests/golden/ -update\n\`\`\``;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((i) => (i.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Golden contract failed again: [run](${runUrl}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Golden corpus drift detected',
                body,
              });
            }
